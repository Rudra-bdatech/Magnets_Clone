<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeadMagnets LinkedIn Sync</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo-box">
        <div class="logo-dot"></div>
        <span class="logo-title">LeadMagnets</span>
      </div>
      <span class="badge" id="statusBadge">Active</span>
    </div>

    <!-- Account Connection Card -->
    <div class="account-card" id="accountCard">
      <div class="account-header">
        <span class="account-label">ACCOUNT</span>
        <button type="button" id="changeAccountBtn" class="link-btn">Change</button>
      </div>
      
      <!-- Connected State -->
      <div id="connectedView" class="account-connected">
        <div class="account-avatar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <span id="connectedEmail" class="account-email" title="Account Email">not set</span>
      </div>

      <!-- Edit / Setup State -->
      <div id="setupView" class="account-setup" style="display: none;">
        <div class="input-row">
          <input type="email" id="emailInput" placeholder="Enter account email" class="email-input" />
          <button type="button" id="saveEmailBtn" class="small-btn primary">Save</button>
        </div>
        <button type="button" id="autoDetectBtn" class="detect-btn">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          <span>Auto-detect from open Dashboard</span>
        </button>
      </div>
    </div>

    <div class="metrics">
      <div class="metric-item">
        <div class="metric-num" id="dmsCount">0</div>
        <div class="metric-label">DMs Sent</div>
      </div>
      <div class="metric-item">
        <div class="metric-num" id="commentsCount">0</div>
        <div class="metric-label">Replies</div>
      </div>
    </div>

    <div class="status-box" id="statusBox">
      <div class="status-dot" id="statusDot"></div>
      <div class="status-text" id="statusText">Ready to sync comments</div>
    </div>

    <button id="syncBtn" class="primary-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>
      <span>Sync LinkedIn Comments Now</span>
    </button>

    <button id="sendChatBtn" class="action-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
      <span>Send Lead Magnet in Current Chat</span>
    </button>

    <div class="footer">
      <span>Auto-Sync: <strong>Every 5 Mins</strong></span>
      <span id="lastSync">Just now</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
