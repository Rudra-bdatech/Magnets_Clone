  - id: "custom-domains"
    topic: "Custom domains"
    category: "SET UP"
    badge: "OPTIONAL SETUP"
    questions:
      - "How do I connect a custom domain?"
      - "Custom domains"
      - "apna domain kaise connect karein?"
      - "custom domain setup CNAME record"
      - "can I use my own domain name?"
      - "funnel me domain kaise add karein?"
      - "is custom domain mandatory?"
    answer: >
      Using your own domain is completely optional! Every published funnel automatically includes a fast, secure funnels.co.in link.
      A custom domain gives you a recognisable branded address (like get.yourbrand.com), but is not required to create, publish, deliver, or collect signups.
    steps:
      - step: 1
        title: "Choose your subdomain"
        description: "We recommend a subdomain such as resources.yourdomain.com or get.yourdomain.com."
      - step: 2
        title: "Add CNAME record"
        description: "Log into your DNS provider (Cloudflare, GoDaddy, Namecheap) and create a CNAME record pointing your subdomain to host.funnels.co.in."
      - step: 3
        title: "Verify in Funnels"
        description: "Enter the subdomain in Workspace Setup > Custom Domains and click Verify. SSL certificates are provisioned automatically."
    notes: "Custom domains are purely optional. You can launch your funnel immediately using your default link without waiting for DNS propagation."
    source: "components/dashboard/HelpCenterContent.tsx"

